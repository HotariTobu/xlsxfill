[project]
name = "xlsxfill"
version = "0.1.1"
description = "Generate an xlsx by merging a template xlsx with data."
readme = "README.md"
authors = [
    { name = "HotariTobu", email = "hotari24tools@gmail.com" }
]
license = "CC0-1.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["xlsx", "excel", "spreadsheet", "template", "report"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "xlsxedit>=1.0.1",
]

[project.urls]
Homepage = "https://hotaritobu.github.io/xlsxfill/"
Documentation = "https://hotaritobu.github.io/xlsxfill/"
Repository = "https://github.com/HotariTobu/xlsxfill"
Issues = "https://github.com/HotariTobu/xlsxfill/issues"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["xlsxfill", "_excel", "_patched_xlsxedit"]

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]
docs = [
    "mike>=2.2.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[tool.ruff.lint]
extend-select = [
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "D",
    "ERA",
    "FA",
    "FBT",
    "G",
    "I",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "S",
    "SIM",
    "TC",
    "TID",
    "UP",
    "W",
]
ignore = ["D1"]

[tool.ruff.lint.per-file-ignores]
"tests/test_*.py" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"
