site_name: xlsxfill
site_description: Generate an xlsx by merging a template xlsx with data.
site_url: https://hotaritobu.github.io/xlsxfill/
repo_url: https://github.com/HotariTobu/xlsxfill
repo_name: HotariTobu/xlsxfill
edit_uri: edit/main/docs/

theme:
  name: material

nav:
  - Home: index.md
  - Samples: samples.md
  - Syntax: syntax.md
  - API: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

hooks:
  - .mkdocs/hooks/samples.py

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  version:
    provider: mike
    default: latest
