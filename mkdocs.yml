site_name: xlsxfill
site_description: Generate an xlsx by merging a template xlsx with data.
site_url: https://hotaritobu.github.io/xlsxfill/
repo_url: https://github.com/HotariTobu/xlsxfill
repo_name: HotariTobu/xlsxfill
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

exclude_docs: |
  AGENTS.md
  CLAUDE.md

validation:
  anchors: warn

nav:
  - Home: index.md
  - Samples: samples.md
  - Syntax: syntax.md
  - API: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

hooks:
  - .mkdocs/hooks/samples.py

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: simple/pypi
      link: https://pypi.org/project/xlsxfill/
      name: xlsxfill on PyPI
  version:
    provider: mike
    default: latest
